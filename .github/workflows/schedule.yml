name: Stock Screener Schedule

on:
  schedule:
    # 台灣時間週一至週五 16:30（UTC 08:30）執行，確保證交所、櫃買中心已公布當天資料
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write  # 允許把交易日誌、集保快照存回 GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      - name: 儲存交易日誌與集保快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update journal $(TZ=Asia/Taipei date +%F)" && git push)
