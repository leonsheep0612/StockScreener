name = "stock-screener-line"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 讓 settings.html 以字串匯入
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# 在 Cloudflare 後台 Workers → stock-screener-line → Logs 可查看執行紀錄
[observability]
enabled = true

# 台灣時間週一至週五 17:00（UTC 09:00）觸發 GitHub Actions 篩選，17:30（UTC 09:30）再補一次：
# 17:00 已成功的話 17:30 會直接略過；16:30 左右證交所查詢量大，曾經逾時，所以避開。
# GitHub 自己的排程會延遲好幾個小時，Cloudflare 的 cron 準時；星期用英文縮寫，Cloudflare 的數字 1 是週日
# 改時間時，src/index.js 的 FIRST_CRON 要跟著改
[triggers]
# 第三個：台灣時間 08:00～22:50 每 10 分鐘觸發 BEAMS 拖鞋進貨監控（beams-watch.yml），改時間時 src/index.js 的 BEAMS_CRON 要跟著改
crons = ["0 9 * * MON-FRI", "30 9 * * MON-FRI", "*/10 0-14 * * *"]

[vars]
GITHUB_REPO = "leonsheep0612/StockScreener"
GITHUB_BRANCH = "main"
WORKFLOW_FILE = "schedule.yml"

# 以下密鑰由 GitHub Actions（.github/workflows/deploy-worker.yml）從 GitHub Secrets 設定，不要寫在這裡：
#   LINE_CHANNEL_SECRET        Messaging API channel 的 Channel secret（驗證 webhook 簽章）
#   LINE_CHANNEL_ACCESS_TOKEN  Messaging API channel 的 access token（回覆訊息）
#   LINE_USER_ID               你自己的 userId，只有這個人能改設定
#   LIFF_ID                    LIFF App 的 ID
#   LIFF_CHANNEL_ID            LIFF App 所在的 LINE Login channel 的 Channel ID（驗證登入身分）
#   GITHUB_TOKEN               GitHub fine-grained token：本 repo 的 Contents 與 Actions 讀寫權限
